name: CI
on: [push, pull_request]
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: '3.12'
      - run: uv sync --frozen
      - run: uv run pytest
      - run: node --check static/app.js
      - run: node --check static/theme.js
      - run: python cloudflare/build.py && node --test cloudflare/worker.test.mjs
