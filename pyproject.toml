[project]
name = "tashkeel"
version = "0.1.0"
description = "Standalone Arabic vocalization for text and Word documents"
requires-python = ">=3.12"
dependencies = ["fastapi>=0.115,<1", "uvicorn>=0.30,<1", "onnxruntime==1.31.0", "numpy>=1.26,<3", "python-multipart>=0.0.22", "lxml>=6,<7"]
[dependency-groups]
dev = ["pytest>=8", "httpx>=0.28"]
[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
